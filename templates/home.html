<html>
<head>
    <title>Home</title>
</head>
<body>
    <h1>My List</h1>
    <p>You have {{ mylist|length }} items.</p>

    <ul>
    {% for myitem in mylist %}
        <li>
            {{ myitem.name }}
            {% if myitem.completed %}
                Completed
            {% else %}
                In progress
            {% endif %}
        </li>
    {% endfor %}
    </ul>
</body>
</html>
